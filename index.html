<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto-Calculadora</title>
</head>
<body>
    <div id="calculadora" class="calculadora">
        <div id="visor" class="visor">
        </div>
        <div id="botones" class="botones">
            <div class="fila-1">
                <button class="button" id="del">DEL</button>
                <button class="button" id="c">C</button>
            </div>
            <div class="fila-2">
                <button class="button" id="7">7</button>
                <button class="button" id="8">8</button>
                <button class="button" id="9">9</button>
            </div>
            <div class="fila-3">
                <button class="button" id="4">4</button>
                <button class="button" id="5">5</button>
                <button class="button" id="6">6</button>
            </div>
            <div class="fila-4">
                <button class="button" id="1">1</button>
                <button class="button" id="2">2</button>
                <button class="button" id="3">3</button>
            </div>
            <div class="fila-5">
                <button class="button" id="0">0</button>
            </div>
            <div class="fila-6">
                <button class="button" id="+">+</button>
                <button class="button" id="-">-</button>
            </div>
            <div class="fila-7">
                <button class="button" id="x">x</button>
                <button class="button" id="/">/</button>
            </div>
            <div class="fila-8">
                <button class="button" id="=">=</button>
            </div>
        </div>
    </div>
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="index.js"></script>    
</body>
</html>
